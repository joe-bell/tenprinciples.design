# Version updates arrive as one grouped pull request a month (on the 22nd),
# covering npm and GitHub Actions together, so CI and the preview build run
# once. Security updates are unaffected: each advisory still opens its own pull
# request straight away.
#
# - `cooldown` skips releases younger than seven days, a buffer against
#   compromised or quickly yanked releases.
# - `rebase-strategy: disabled` stops Dependabot rebasing the pull request
#   after every merge to `main`, each of which would re-run CI. Branches need
#   not be up to date to merge; on a conflict, comment `@dependabot recreate`
#   (`@dependabot rebase` did nothing here on 2026-11-18).
# - `versioning-strategy: increase` raises the exact pin rather than widening
#   it into a range.
# - GitHub Actions are checked in the workflows and in the composite actions
#   under `.github/actions/`.
version: 2
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: cron
      cronjob: "0 9 22 * *"
    commit-message:
      prefix: deps

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly
    cooldown:
      default-days: 7
    rebase-strategy: disabled
    versioning-strategy: increase
    ignore:
      # @emnapi/runtime is pinned to 1.x so @astrojs/astro2tsx's
      # @napi-rs/wasm-runtime peer matches the @emnapi/core 1.x it ships;
      # with the 2.0 beta, @astrojs/check fails to load and the build breaks.
      # Drop once astro2tsx supports the 2.x runtime.
      - dependency-name: "@emnapi/runtime"
        versions: [">=2"]
      # astro check refuses TypeScript 7, so a 7.x bump fails the build.
      # Drop once astro's own check command supports it, or the build stops
      # running astro check.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Keep the Node types on the major that .node-version pins.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # prettier-plugin-astro 1.x reformats the .astro pages, splitting inline
      # elements onto new lines, which can change rendered whitespace. Drop
      # once a 1.x release has been checked against the pages.
      - dependency-name: "prettier-plugin-astro"
        versions: [">=1"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    patterns: ["*"]
    multi-ecosystem-group: monthly
    cooldown:
      default-days: 7
    rebase-strategy: disabled
