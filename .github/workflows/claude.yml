# Claude Code, interactive mode only.
#
# There is no `prompt` input, so the action only ever runs in response to a human
# writing `@claude` — it never runs unattended and cannot self-trigger.
#
# Auth is the `CLAUDE_CODE_OAUTH_TOKEN` repo secret (generate it with
# `claude setup-token`).
#
# Issues are disabled on this repo, so the `issues` trigger is omitted — re-add it
# alongside its `if:` clause if issues are ever turned on. `issues: write` is kept
# regardless: pull request conversation comments are posted through the issues API.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Public repo: only Joe can trigger Claude. github.actor covers all three
    # event types uniformly and is stricter than the action's built-in
    # write-access check, which repo collaborators would also pass.
    if: |
      github.actor == 'joe-bell' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push commits to branches
      pull-requests: write # open PRs, comment
      issues: write # comment on issues
      id-token: write # the action's GitHub App auth
      actions: read # read CI results on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
